<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찾아올팍 — 올림픽공원 유실물 지도</title>
<meta name="description" content="올림픽공원에서 습득된 유실물을 습득 장소 기준으로 지도에서 찾아보세요. 회원가입 없이 바로 확인할 수 있습니다.">
<meta name="theme-color" content="#0f766e">
<meta property="og:title" content="찾아올팍 — 올림픽공원 유실물 지도">
<meta property="og:description" content="올림픽공원에서 잃어버린 물건, 어디서 주웠는지 지도로 확인하세요.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="lib/MarkerCluster.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app" data-mode="map" data-sheet="half">

  <header class="top">
    <a class="brand" href="./" aria-label="찾아올팍 처음 화면">
      <img src="favicon.svg" alt="" width="28" height="28">
      <span class="brand-name">찾아올팍</span>
      <span class="brand-sub">올림픽공원 유실물 지도</span>
    </a>
    <button class="icon-btn" id="btnInfo" type="button" aria-label="서비스 안내">안내</button>
  </header>

  <nav class="modes" role="tablist" aria-label="찾는 방법">
    <button role="tab" data-mode="map" aria-selected="true">지도로 찾기</button>
    <button role="tab" data-mode="venue" aria-selected="false">공연장·날짜로 찾기</button>
    <button role="tab" data-mode="stats" aria-selected="false">현황</button>
  </nav>

  <!-- 지도로 찾기: 필터 -->
  <section class="filters" id="filtersMap" aria-label="필터">
    <div class="row">
      <div class="seg" role="group" aria-label="습득 기간">
        <button type="button" data-period="7">최근 7일</button>
        <button type="button" data-period="30">최근 30일</button>
        <button type="button" data-period="all" class="on">전체 보관 중</button>
      </div>
    </div>
    <div class="row chips" id="catChips" role="group" aria-label="품목"></div>
    <div class="row chips toggles" role="group" aria-label="함께 보기">
      <span class="tg-label">함께 보기</span>
      <label class="chip tgc on"><input type="checkbox" id="tgStations" checked><span>주변 역 습득물</span></label>
      <label class="chip tgc"><input type="checkbox" id="tgHot" checked><span>자주 줍는 곳</span></label>
      <label class="chip tgc"><input type="checkbox" id="tgTransferred"><span>경찰서 이관</span></label>
      <label class="chip tgc"><input type="checkbox" id="tgReturned"><span>반환 완료</span></label>
    </div>
  </section>

  <!-- 공연장·날짜로 찾기: 조건 -->
  <section class="filters" id="filtersVenue" aria-label="공연장과 날짜" hidden>
    <p class="hint">공연장과 관람한 날짜를 고르면, 그날 이후 공연장 주변에서 습득된 물건만 보여 드립니다.</p>
    <div class="row chips" id="venueChips" role="group" aria-label="공연장"></div>
    <div class="row">
      <label class="date-field">관람한 날짜
        <input type="date" id="venueDate">
      </label>
      <div class="quick-dates" id="quickDates"></div>
    </div>
    <div class="row chips" id="showChips" hidden></div>
  </section>

  <div class="stage">
    <div id="map" class="map" aria-label="습득 장소 지도"></div>
    <div class="map-note" id="mapNote" hidden></div>

    <!-- 목록 시트 -->
    <section class="sheet" id="sheet" aria-label="습득물 목록">
      <button class="sheet-handle" id="sheetHandle" type="button" aria-label="목록 펼치기·접기"><span></span></button>
      <div class="sheet-tabs" role="tablist">
        <button role="tab" data-tab="located" aria-selected="true">지도 위 물건 <b id="cntLocated">0</b></button>
        <button role="tab" data-tab="unknown" aria-selected="false">위치 불명 <b id="cntUnknown">0</b></button>
        <button role="tab" data-tab="station" aria-selected="false">주변 역 <b id="cntStation">0</b></button>
      </div>
      <div class="sheet-desc" id="sheetDesc"></div>
      <ul class="list" id="list"></ul>
    </section>

    <!-- 현황 -->
    <section class="stats" id="stats" hidden aria-label="습득물 현황"></section>
  </div>
</div>

<dialog id="dlgItem" class="dlg" aria-label="물품 상세">
  <form method="dialog"><button class="dlg-close" aria-label="닫기">×</button></form>
  <div id="itemBody"></div>
</dialog>

<dialog id="dlgInfo" class="dlg" aria-label="서비스 안내">
  <form method="dialog"><button class="dlg-close" aria-label="닫기">×</button></form>
  <div id="infoBody"></div>
</dialog>

<noscript><p style="padding:16px">이 서비스는 자바스크립트를 켜야 볼 수 있습니다.</p></noscript>
<script src="lib/leaflet.js"></script>
<script src="lib/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
